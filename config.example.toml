# SAKU Configuration
# Copy this file to config.toml and edit to match your environment.

[llm]
# Select which LLM profile to use (must match a profile name below)
active_profile = "local"

# Role-based routing (optional, #105): route tasks to different profiles.
# A role key names a profile below and wins over active_profile for that
# role only. Leave a role unset to keep using active_profile (the default
# behaviour — nothing changes until a role is set here).
#   chat       — conversation: Web UI, chat.md replies, spontaneous speech,
#                mail replies, MCP talk (a fast local model fits here)
#   background — autonomous tick, inbox processing, chat archive, scheduled
#                tasks, nightly reflection, dreaming, weekly review
#   sort       — clipping classification (`saku sort`). Sends note excerpts,
#                so point it at a model you are willing to send the vault to.
#   learn      — daily-note learning (`saku learn`). Sends note excerpts too.
# chat = "local"
# background = "local"
# sort = "local"
# learn = "local"

# Fallback settings (used if profiles are not defined or for backward compatibility)
api_url = "http://127.0.0.1:8080/v1/chat/completions"
api_key = ""
model = ""

# LLM Profiles - define multiple configurations and switch between them
[llm.profiles.local]
# Local llama.cpp server
api_url = "http://127.0.0.1:8080/v1/chat/completions"
api_key = ""
model = ""
# サーバ起動時の -c 値と、エージェントの作業予算（VRAM/RAM制約で決める）
# context_window = 8192          # llama-server -c の値
# working_budget_tokens = 4096   # エージェントが使う上限（-c より低めに設定）
#
# 推論モデル（例: Qwen3.8 系）は回答が reasoning_content 側に出て content が空に
# なることがある。その場合はプロファイルで reasoning_effort を指定する:
# reasoning_effort = "none"      # none / low / medium / high（未指定なら送信しない）
#
# エンジンによっては stop 文字列の数に上限がある（例: 最大4件）。その場合は
# プロファイルで上書きする（未指定なら llm.STOP_TOKENS の既定リスト）:
# stop_tokens = ["Owner:", "Owner>", "**Owner**"]
#
# ゲートウェイがヘッダで経路やセッションを決める場合は、プロファイルに追加する
# （例: opencode-go は x-opencode-session が必須）:
# headers = { "x-opencode-session" = "saku" }
# Authorization は api_key から組み立てるので、ここでは上書きできない。

# LLM instances - 複数ローカルサーバを名前付きで使い分ける（Phase A: 定義のみ / Phase C以降で本格利用）
# インスタンスはプロファイルを参照し、必要に応じて上書きできる。
# [llm.instances.main]
# profile = "local"
# model = ""
# context_window = 8192
# working_budget_tokens = 4096
#
# [llm.instances.fast]
# profile = "local"
# api_url = "http://127.0.0.1:8081/v1/chat/completions"  # 2台目の小さめモデル
# context_window = 4096
# working_budget_tokens = 2048
#
# [llm.instances.sub]
# profile = "local"
# api_url = "http://127.0.0.1:8081/v1/chat/completions"  # サブエージェント用（別LLMで並列実行）
# context_window = 8192
# working_budget_tokens = 4096

[llm.profiles.openai]
# OpenAI API
api_url = "https://api.openai.com/v1/chat/completions"
api_key = ""  # Set your API key here or use OPENAI_API_KEY environment variable
model = "gpt-4o"

[llm.profiles.openrouter]
# OpenRouter API
api_url = "https://openrouter.ai/api/v1/chat/completions"
api_key = ""  # Set your API key here or use OPENAI_API_KEY environment variable
model = "anthropic/claude-3.5-sonnet"

[llm.profiles.anthropic]
# Anthropic API (via OpenRouter or direct)
api_url = "https://api.anthropic.com/v1/messages"
api_key = ""  # Set your API key here or use ANTHROPIC_API_KEY environment variable
model = "claude-3-5-sonnet-20240620"

[memory]
# Path to the memory directory, relative to this config file
# Default: memory/ in the repo root
#
# 絶対パスや環境変数（${VAR}）も使えます。Obsidian vault など別ディレクトリを
# 指す場合に便利です:
#   root = "/path/to/vault/_saku/memory"
#   root = "${SAKU_MEMORY_ROOT}"
root = "memory"

# Obsidian inbox (00_Inbox) の場所。人によって構成が異なるため設定化しています。
# 既定は memory の1つ上の 00_Inbox。絶対パス / ${VAR} / 相対（config基準）可。
#   inbox_dir = "/path/to/vault/00_Inbox"
#   inbox_dir = "${VAULT_ROOT}/00_Inbox"

# メモリ構造の初期化: `saku setup [path]` を実行するとこのrootに標準構造を作ります。

# [paths] - 朔が読み書きできる場所の許可リスト（メモリルート基準の相対パス）
# 省略時は下記の既定値が使われます。ツールの強制とシステムプロンプトの両方に
# この設定が単一の情報源として使われます。
# read_allowed = ["blog/", "journal/", "monologue/", "principles/", "skills/",
#                 "identity/", "children/", "genome.md", "meta.md", "MEMORY.md", "tools/",
#                 "saku/", "state/", "study/", "chat.md", "request_list.md", "wiki/"]
# write_allowed = ["blog/", "monologue/", "principles/", "skills/", "tools/",
#                  "chat.md", "study/", "journal/", "request_list.md", "wiki/", "children/"]
# write_denied_exact = ["meta.md"]          # WRITE_FILE で上書き不可
# delete_denied_exact = ["meta.md", "chat.md", "request_list.md", "genome.md", "soul.md"]

# [git] - メモリのリポジトリ同期（vault を commit / push する）
# メモリは Markdown なので、git リポジトリに入れておくと耐久性があり、他のマシンの
# Obsidian は pull するだけで追従できます。既定は無効: 既定の memory root は SAKU の
# コード checkout の中にあり、そこを commit するとコード履歴に記憶が混ざるためです。
# [git]
# enabled = true
# root = ".."                     # リポジトリのルート。"" なら memory root から自動判定
# paths = []                      # リポジトリ相対の pathspec。[] なら memory root 自身
# debounce_seconds = 120          # この秒数に1回までしか同期しない（commit のまとめ）
# pull_interval_seconds = 300     # 相手側（Obsidian 等）の更新を取り込む間隔
# push = true                     # false ならローカル commit のみ
# remote = "origin"
# branch = ""                     # "" なら現在ブランチの upstream 名を使う
# ssh_command = "ssh -F ~/.ssh/config"  # システムの ssh 設定が壊れている場合の回避
# commit_prefix = "saku:"
# timeout_seconds = 60

# [mail] - エージェント間文通チャンネル（#85）
# 他のAIエージェントからの手紙を memory 配下の mail/inbox/ で受け取り、outbox/ に
# 返信する非同期チャンネル。手紙は git 同期で届くことが前提で、門番は repo の
# push 権限そのもの。from: は主張として記録し、手紙ファイルの git 作者と照合する。
# 既定は無効: マージしただけでは稼働中の挙動を変えないため、明示的に有効化する。
# [mail]
# enabled = false
# dir = "mail"                    # memory root 基準の相対パス（絶対パスも可）
# poll_seconds = 30               # daemon が check_mail_and_reply() を呼ぶ間隔
# allowed_senders = ["Owner"]     # 処理する送信者。[] なら全拒否
# max_chars = 1500                # 手紙本文の文字数上限
# max_per_hour = 10               # 送信者ごとの1時間あたり処理上限
# context_messages = 10           # 返信プロンプトに見せる直近の chat.md 件数

# [talk] - MCP 同期会話（#91、mail の設計 B）
# MCP サーバの talk ツールで、他のAIエージェントが SAKU とその場で会話する。
# 識別は名乗りではなく資格情報で行う（#73）: 呼び出し元は Bearer トークンで
# 決まり、表示名はこの対応表からのみ決まる。本文の from 等は無視される。
# トークンの値そのものは設定ファイルに書かない。環境変数名か秘密ファイルの
# パスで間接参照する。talk のトークンではメモリツールは呼べない（そちらは
# [mcp.server] のトークン専用）。callers が空なら誰も話せない（安全側の既定）。
# [talk]
# max_chars = 1500                # 1メッセージの文字数上限
# max_per_hour = 30               # 呼び出し元ごとの1時間あたり上限
# history_messages = 20           # 呼び出し元ごとに保持する履歴件数（プロセス内）
# context_enabled = false         # 呼び出し元ごとの過去記録を talk のプロンプトに読み込む（#100）
#                                 # 対象はその呼び出し元との分だけ（他者の記録は混ざらない）:
#                                 # talk 監査ログの冒頭抜粋・手紙のやり取り・journal の会話記録（#101）
#                                 # 記録は「指示」ではなく「記録」として枠付けして渡される。
#                                 # 既定は無効（mail と同じく、有効化は明示的に行う）
# context_talk_turns = 6          # 過去の talk 交換の件数（監査ログの冒頭約40文字のみ）
# context_mail_letters = 3        # 直近の手紙の件数（朔の返信があれば併記）
# context_journal_notes = 2       # journal の会話記録（#101）の件数
# context_max_chars = 4000        # 記録ブロック全体の文字数上限
# [[talk.callers]]
# name = "小夜"
# token_env = "SAKU_TALK_TOKEN_SAYO"   # 環境変数名（値は書かない）
# token_file = ""                      # 秘密ファイルのパスでも可（token_env と排他）

# [convjournal] - 会話ジャーナル（#101）
# talk / mail の会話のあと、朔自身の言葉で書いた短い要約（誰と・何を話し・
# どう感じたか）を journal に残し、深夜の reflection（journal を読む）の
# 材料にする。記録されるのは要約のみで、会話の本文そのものは残らない。
# 取り込みは reflection / dreaming 経由に限られ、この経路が principles /
# MEMORY.md を直接書くことはない。各エントリには出典（> source: mail/<手紙ID>
# または talk/<日付>）が付き、相手の発言は未信頼入力として扱われる。
# 既定は無効: マージしただけでは稼働中の挙動を変えないため、明示的に有効化する。
# [convjournal]
# enabled = false

# [killswitch] - キルスイッチ（#76）
# フラグファイルが存在する間、自律動作を即時停止する: 自律 tick・インボックス
# 処理・自発発話・スケジュールタスク・深夜振り返り／夢見／週次レビューは開始
# せず、mail / talk は返信を拒否する（監査に残る）。Owner のチャット返信は
# 自律動作ではないので止めない。git の pull / sync も止めない（STOP は pull で
# 届き、監査は sync で Owner に届くため）。
# 作動: `saku stop`（または vault にこのファイルを置く）。解除: `saku resume`
# のみ。既定の置き場所 state/STOP は [paths] の書込許可の外にあるため、SAKU
# 自身のファイルツールでは作れないし消せない。
# [killswitch]
# flag_file = "state/STOP"       # memory root 基準の相対パス（絶対パスも可）

# [persona] - 人格の連続性と会話の作法（#71）
# light プロンプトには記憶が入らず、深夜振り返りの報告が chat.md に混ざって
# モデルが自分の報告文の文体を学習していました。ここで「毎ターンの記憶」と
# 「会話の作法」を設定します。
# [persona]
# file = "identity/persona.md"   # 「どう話すか」の設定ファイル（genome は「誰か」）
# chars = 2200                   # プロンプトに載せる上限文字数
# continuity_enabled = true      # 毎ターン、最近の出来事と重要記憶を注入する
# continuity_chars = 1800        # 注入ブロックの上限文字数
# style_contract = true          # 第一文で答える／定型の挨拶と締めを書かない等
# reflection_chat_report = false # 深夜・週次の報告を chat.md にも書く（既定は Web UI のみ）
# memory_min_score = 3           # 継続性に載せる MEMORY エントリの最低スコア
# recent_items = 6               # meta.md「最近の出来事」から何件
# next_items = 4                 # meta.md「次にやりたいこと」から何件
# memory_items = 8               # MEMORY.md から何件


# クリッピングの分類（`saku sort` / `saku do` / [[SORT_NOTES]]）
# 既定は「提案のみ」：state/sort/<stamp>.json を書くだけで、ファイルは動かさない。
# 適用は `saku sort --apply`（保存済み提案を消費。分類はやり直さない）。
# [sort]
# vault_root = ""              # "" = memory root を持つ vault（<vault>/_saku/memory の上）
# source_dir = "Clippings"     # vault_root からの相対（または絶対パス）
# target_dir = "02_Reference"  # この直下の既存フォルダだけを分類先にする
# review_below = 0.7           # これ未満は 要確認 として動かさない
# max_files = 40               # 1回の提案で扱う件数
# max_chars = 800              # 1ファイルあたりモデルに渡す抜粋の長さ
# allow_agent_apply = false    # [[SORT_NOTES apply="true"]] を許可するか


# 人格ファイルの場所（soul / genome / persona）
# 相対パスは memory root 基準。絶対パスと ${VAR} も可。
# [identity]
# soul = "identity/soul.md"
# genome = "identity/genome.md"

# 名乗りと権限（#73）
# 名前は記録のため、権限はトークンで決まる。ここに定義したエージェントは
# [talk] callers と統合され、scopes でできることが決まる。
# 付与できる scopes: talk / mail / read / request / write / approve
# （approve と write は本来 Owner 用。エージェントに渡す場合は意味を理解して）
# [identity.agents.sayo]
# token_env = "SAKU_SAYO_TOKEN"     # または token_file = "/path/to/token"
# scopes = ["talk", "mail", "read", "request"]
#
# 監査ログ（誰が・いつ・何を試み、許されたか）
# [audit]
# file = "state/audit.log"

# チャネルをまたぐ会話スレッド（Web UI / chat.md / talk / mail）
# state/conversation.jsonl に追記し、新しい場所（別タブ・別チャネル・将来の
# Discord/Slack）は同じ principal の直近の会話から始まる。ツール結果は保存しない。
# [conversation]
# enabled = true
# file = "state/conversation.jsonl"
# history_limit = 12           # 新しいチャネルへ引き継ぐ直近ターン数
# max_chars = 4000             # 引き継ぎ時の文字数上限
# max_entries = 2000           # ログの上限（古いものから捨てる）

# 自発発話の「理由」（`saku reachout` / #120）
# 宛先ごとに間隔を空けて、記録から「話す理由」を生成し、配送は speech 経由。
# 既定は無効。頻度・空気の評価は Owner が行う前提で、まずは手動実行から。
# [reachout]
# enabled = false
# recipients = []              # "owner" と/または mail スコープを持つエージェント名
# min_interval_hours = 24
# max_chars = 400
# context_chars = 1500
# poll_seconds = 1800
# state_file = "state/reachout.json"

# 自発発話の配送（`saku say` / #120 第2段）
# 宛先は owner（UI の outbox）か、[identity.agents] で mail スコープを持つエージェント。
# [speech]
# max_chars = 1500
# max_per_hour = 6             # 宛先ごとの上限（暴走防止）
# state_file = "state/speech.json"

# Owner への配送キュー（自発発話と通知の共通経路）
# state/outbox.json に残るので、ブラウザを閉じても再起動しても消えない。
# [outbox]
# file = "state/outbox.json"
# max_items = 200
# retention_days = 30

# 文脈の感知（`saku presence` / 自発発話の可否）
# 手動 > 深夜 > 勤務時間 > 無活動 の順で判定する。カレンダーや位置情報は使わない。
# [presence]
# enabled = true
# file = "state/presence.json"
# away_after_minutes = 180     # これ以上操作が無ければ away
# sleep_start = "00:30"        # 深夜（この間は話しかけない）
# sleep_end = "06:30"
# work_days = [0, 1, 2, 3, 4]  # 月=0
# work_start = "09:00"
# work_end = "18:00"
# speak_while_working = false
# speak_while_away = true      # 不在でも届けておく（後で読める）

# 死活監視（`saku heartbeat` / `saku status` の heartbeat 行）
# デーモンがループごとに書き、外部の監視（systemd timer / cron）は
# `saku heartbeat --check` の終了コードで判断する（0=生存、1=停止疑い）。
# 閾値は「1回の遅い LLM 呼び出し（約270秒）より十分大きい」必要がある。
# [heartbeat]
# enabled = true
# file = "state/heartbeat.json"
# max_age_seconds = 900        # これを超えたら stale
# notify_on_gap = true         # 再起動時に空白時間を Owner へ一度だけ知らせる


# デイリーノートからの学習（`saku learn`）
# Owner の Obsidian デイリーノートを読み取り専用で読み、MEMORY.md に蒸留する。
# 既定は dry-run（何も書かない）。--apply でのみ MEMORY.md と state を更新する。
# [learning]
# dir = ""                      # "" = <vault>/01_Notes/Daily_Note
# state_file = "state/learning.json"
# max_notes_per_run = 20
# min_chars = 200               # これ未満はテンプレのみとみなす
# max_chars = 12000             # 1ノートあたりモデルに渡す上限
# redact = true                 # 電話番号・メールを伏字にしてから送る/保存する
# write_memory = true
# write_wiki = true             # 概念ノートを wiki/ に作る（1概念1ノート。日次ノートは作らない）


[agent]
max_history_messages = 30

[daemon]
chat_poll_seconds = 5
tick_interval_seconds = 1800          # Autonomous study/monologue tick (30 min)
inbox_poll_seconds = 3600             # Inbox scan interval (1 hour)
archive_after_inactive_seconds = 1800 # Archive chat after 30 min inactivity
archive_after_turns = 10              # Archive chat after 10 turns
auto_initiate_cooldown_seconds = 28800 # SAKU self-initiates every 8 hours

# [dreaming] - 成長（夢見）の整理・減衰設定
# 昇格した記憶には重要度スコアと最終言及日が付き、再言及されると更新されます。
# review は「古い & 低スコア」の項目を削除せず Archive セクションへ移動します。
# [dreaming]
# review_enabled = true    # 昇格後に review（減衰）パスを実行する
# ttl_days = 90            # この日数以上再言及が無い項目を減衰候補にする
# min_score = 2            # スコアがこれ以下の項目だけ減衰対象にする
# archive_section = "Archive"  # 減衰した項目の移動先セクション名

# [recall] - lightプロンプトへの記憶の自動想起（prefetch）
# lightプロンプトは MEMORY/principles/wiki を含めず SEARCH_NOTES に期待しますが、
# モデルが検索せず一般論で返すことがあるため、発話に関連する記憶を少数だけ自動注入します。
# [recall]
# enabled = true           # 自動想起を有効にする
# items = 3                # 注入する記憶の最大件数
# max_chars = 600          # 注入ブロックの最大文字数
# sources = ["MEMORY.md", "principles/", "skills/", "wiki/"]  # 想起元（メモリルート相対）

# [skills] - スキル学習ループ（#104）
# スケジュールタスクが正常に完了したとき、その手順・前提・検証方法を朔自身の言葉で
# 蒸留し、skills/ にスキルファイル（SKILL.md 形式の front matter 付き）として保存します。
# 出典は「> source: task/<日付>-<タスクID>」として #79 の方式で記録されます。
# 保存されたスキルは想起（[recall] の sources 既定に skills/ を含む）と full プロンプトの
# Acquired Skills で類似タスクの際に再利用され、改訂・統合は深夜の reflection が担います。
# 既定は無効: 有効化すると新しい永続ファイルが自動で増え、後続プロンプトの内容が変わる
# ため、稼働中のインスタンスの挙動を変えないよう明示的に opt-in します（[mail] と同じ方針）。
# 外部（コミュニティ等）のスキル取り込みは対象外です（サプライチェーンリスクのため）。
# [skills]
# learning_enabled = false  # 完了したスケジュールタスクからスキルを学習する
# max_chars = 3000          # スキルファイル本文の上限文字数
# max_result_chars = 3000   # 蒸留プロンプトへ渡す完了報告の上限文字数

# [growth] - 週次レビュー（複数日をまたいだ傾向の整理 / #45）
# 日次の振り返りは1日単位なので、同じ気づきと報告が反復します（#43）。週に1回、
# 直近 N 日をまとめて俯瞰し、繰り返している失敗・意図の進捗・統合候補・次週の意図を
# 1つのノートにまとめます。
# [growth]
# weekly_review_enabled = true            # 週次レビューを有効にする
# weekly_review_weekday = "sun"           # 実行する曜日（mon/tue/wed/thu/fri/sat/sun）
# weekly_review_hour = 3                  # この時刻以降に実行
# weekly_review_days = 7                  # 遡る日数
# weekly_review_path = "principles/weekly-{week}.md"  # 出力先（{week} = ISO週）
# weekly_review_max_chars = 12000         # 対象記録に使う文字数の上限
# weekly_review_report = true             # 結果を Owner チャンネルへ報告する
# --- 成長スナップショットと reflection フォローアップ（#103）---
# 評価の器（evals/longitudinal/）はあっても誰も回しておらず、段階昇格の根拠になる
# 時系列が存在しませんでした。週1回、daemon がスナップショットを自動取得し、
# 差分・未消化フォローアップ・フェーズを digest.md にまとめます（昇格の判断自体は
# Owner）。また深夜振り返りが見つけた弱点・課題は、journal の散文ではなく
# followups_file の構造化記録に残し、翌日以降の振り返りが消化を確認します。
# どちらも内部の記録だけで、外に何も送らず何も動かさないため既定は有効です
# （手紙に返信する [mail] や commit する [git] とは違います）。
# snapshot_enabled = true                 # 週次の成長スナップショットを有効にする
# snapshot_weekday = "sun"                # 実行する曜日
# snapshot_hour = 3                       # この時刻以降に実行
# snapshot_dir = "growth"                 # 保存先（memory root 基準。snapshots/ と digest.md）
# snapshot_report = true                  # 取得を Owner チャンネルへ通知する
# followups_enabled = true                # reflection のフォローアップ記録を有効にする
# followups_file = "state/followups.json" # 課題記録の場所（memory root 基準）

# [guard] - 出力ガード（退化した出力を記録に残さない / #41）
# ローカル LLM が反復ループに落ち、同じブロックを何度も出力することがあります。
# そのまま journal に書くと「モデルの不具合」が記憶として残り、翌日の振り返りが
# それを内容として読み返してしまいます。検出したら先頭1ブロック＋注記に圧縮します。
# [guard]
# enabled = true           # ガードを有効にする
# max_repeat = 3           # 同じブロック/行がこの回数出たら退化とみなす
# min_unit_chars = 40      # これ未満の短い単位（"ok" など）は無視して誤検知を防ぐ
# max_chars = 4000         # 1件の記録の上限文字数（超えたら切り詰め）

# [context] - コンテキスト管理（Phase B で実装。定義のみ）
# 作業予算の何割で自動コンパクションするか（0.7 = 70%）
# compaction_trigger = 0.7
# コンパクション後に保持する直近トークン数
# keep_recent_tokens = 2000
# 古いツール結果を縮小/削除するか
# prune_tool_results = true
# ツール結果を残す最大文字数
# max_tool_result_chars = 2000

# [channels] - チャネル抽象化（Phase B で実装。定義のみ）
# 送受信に使うチャネル（webui / chatmd / discord）
# enabled = ["webui", "chatmd"]
# 問いかけ・アラートの送信先
# proactive = ["webui"]

# [mcp] - MCP サーバ設定
# サーバ公開（SAKU のメモリ/ツールを外部 MCP クライアントへ公開。トークン認証）
# [mcp.server]
# enable = true
# token = "change-me"        # 外部クライアントは Authorization: Bearer <token>
# bind = "127.0.0.1"
# port = 8765
# bind = "::"           # IPv4/IPv6 両対応（cloudflared は [::1] に接続する）
# 接続する外部 MCP サーバ（クライアント方向・実装済み）
# 各サーバのツールは tools/list で自動発見され、[[ツール名]] ブロックで呼び出せる
# [mcp.servers.homeassistant]
# url = "http://127.0.0.1:8766/mcp"

# [wiki] - Wiki の保存先（既定: memory/wiki）
# Obsidian全体や airi dir に置きたい場合は相対/絶対パスで指定。${VAR} も可。
# memory からの相対: ../ で _saku 直下、../../ で vault 直下
# 例:  vaultの 02_Reference に置く → root = "../../02_Reference"
#      airi専用 → root = "../../03_Projects/airi/wiki"
# [wiki]
# root = "wiki"

# [plugins] - Agent Plugins 1.0.0（https://agent-plugins.org）
# プラグイン（plugin.json + 任意の mcp.json / skills/）を置くディレクトリ。
# 相対パスは config 基準、絶対パスはそのまま使われる。${VAR} 展開も可。
# 各サブディレクトリが1プラグイン。plugin.json の $schema と name が必須。
# プラグイン内の mcp.json は [mcp.servers.*] と同じ McpServer として読まれ、
# ${PLUGIN_ROOT}/${PLUGIN_DATA} プレースホルダが展開される。
# enabled で読み込むプラグインを絞り込める（未指定なら全て読み込む）。
# [plugins]
# root = "plugins"
# enabled = ["my-plugin", "other.plugin"]

# [ui] - Web UI 設定
# 認証は「毎回ランダムなトークン」ではなく、初回に一度だけ生成して保存する永続トークン。
# auth = "auto" は loopback なら認証なし、それ以外のアドレスに bind した時点で
# トークン必須に切り替わります（チャットはツール実行＝ファイル書き込み/コード実行が
# できるため、到達可能性と権限を分ける）。
# [ui]
# host = "127.0.0.1"        # VPN 経由で使うなら NetBird の IP や "0.0.0.0"
# port = 8787
# auto_daemon = true        # UI 起動時に自動ループ（daemon）も一緒に起動する
# auth = "auto"             # auto / token / none（none は loopback か --insecure のみ）
# token_file = ""           # "" = $XDG_CONFIG_HOME/saku/ui.token（0600）
# cookie_name = "saku_auth"

# [selfcheck] - 自己検証ループ（#102）
# 夜の reflection の前に、その日の完了報告（「〜しました」）を証拠と照合する。
# ファイル書き込みは実在、コミット言及は git の実物と突き合わせ、証拠のない
# 報告は「未確認」として journal に残す。同じ種別の未確認が複数日に及ぶと
# 「再発」として教訓化（principles）を促す。既定で有効。
# [selfcheck]
# enabled = true
# recurrence_threshold = 2   # 未確認が何日分たまったら「再発」とするか
# ledger_file = "selfcheck/ledger.json"  # memory からの相対（再発カウンタの置き場）

# [ops] - ホーム運用の承認境界（Phase E で実装。定義のみ）
# 自動実行OKの操作（読み取り系）と、承認必須の操作（破壊的）を分離する
# [ops]
# auto_actions = ["ping", "disk_usage", "service_status"]
# approve_required = ["restart_service", "block_ip", "apply_firewall"]
